
name: AIZ3N Companion Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIZ3N_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aiz3n-release.jks"

      - name: Build signed APK
        env:
          AIZ3N_KEYSTORE_PATH: ${{ runner.temp }}/aiz3n-release.jks
          AIZ3N_STORE_PASSWORD: ${{ secrets.AIZ3N_STORE_PASSWORD }}
          AIZ3N_KEY_ALIAS: ${{ secrets.AIZ3N_KEY_ALIAS }}
          AIZ3N_KEY_PASSWORD: ${{ secrets.AIZ3N_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-Companion-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
